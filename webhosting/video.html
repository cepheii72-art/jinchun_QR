<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>초평애서</title>
  <!-- 파비콘 및 웹브라우저 아이콘 (초평애서 완위각 로고) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/video-player.css?v=20261028_3">
</head>

<body>

  <!-- 비디오 플레이어 래퍼 (가로/세로 자동 최적화) -->
  <div class="player-wrapper" id="playerWrapper">

    <!-- 토스트 알림 메시지 -->
    <div class="player-toast" id="playerToast">알림</div>

    <!-- jin01.mp4 비디오 소스 (GitHub Releases 고속 글로벌 CDN 1080p 무제한 스트리밍) -->
    <video id="mainVideo" class="video-element" poster="images/video_poster.jpg" playsinline webkit-playsinline
      preload="auto">
      <source src="https://github.com/cepheii72-art/jinchun_QR/releases/download/v1.0/jin01.mp4" type="video/mp4">
      현재 브라우저는 비디오 재생을 지원하지 않습니다.
    </video>

    <!-- 버퍼링 스피너 -->
    <div class="loading-spinner"></div>

    <!-- 비디오 화면 클릭 레이어 (재생/일시정지 및 더블탭 10초 스킵) -->
    <div class="player-click-overlay" id="playerClickOverlay"></div>

    <!-- 화면 중앙 대형 재생 버튼 -->
    <button class="big-center-play" id="bigCenterPlay" title="재생 (Space / k)" aria-label="재생">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    </button>

    <!-- 중앙 대형 재생/일시정지 리플 아이콘 -->
    <div class="center-action-indicator" id="centerIndicator">
      <svg id="centerIcon" width="46" height="46" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z" />
      </svg>
    </div>

    <!-- 좌/우 더블탭 10초 스킵 효과 -->
    <div class="double-tap-ripple left" id="leftRipple">
      <div class="skip-icon">◀◀</div>
      <div class="skip-label">10초</div>
    </div>
    <div class="double-tap-ripple right" id="rightRipple">
      <div class="skip-icon">▶▶</div>
      <div class="skip-label">10초</div>
    </div>

    <!-- 하단 컨트롤 바 -->
    <div class="player-controls" id="playerControls">

      <!-- 골드 프로그레스 타임라인 바 -->
      <div class="progress-container" id="progressContainer">
        <div class="time-tooltip" id="timeTooltip">0:00</div>
        <div class="progress-bar-bg">
          <div class="buffer-bar" id="bufferBar"></div>
          <div class="current-bar" id="currentBar">
            <div class="scrubber-handle"></div>
          </div>
        </div>
      </div>

      <!-- 컨트롤 버튼 및 옵션 행 -->
      <div class="controls-bottom">

        <!-- 좌측: 재생/일시정지(대형), 음량 조절, 시간 표시 -->
        <div class="controls-left">
          <!-- ⭐ 큼직한 재생/일시정지 버튼 ⭐ -->
          <button class="ctrl-btn play-pause-btn" id="playPauseBtn" title="재생/일시정지 (Space / k)">
            <svg id="playIcon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>

          <!-- 음량 조절 (선명한 표준 실루엣 스피커 아이콘) -->
          <div class="volume-group">
            <button class="ctrl-btn" id="muteBtn" title="음소거 (m)">
              <!-- 소리 켜짐 -->
              <svg id="volumeHighIcon" viewBox="0 0 24 24">
                <path
                  d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
              </svg>
              <!-- 음소거 -->
              <svg id="volumeMutedIcon" viewBox="0 0 24 24" style="display:none;">
                <path
                  d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
              </svg>
            </button>
            <div class="volume-slider-container desktop-only">
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1"
                title="음량 조절">
            </div>
          </div>

          <!-- 재생 시간 -->
          <div class="time-display">
            <span id="currentTime">0:00</span> / <span id="durationTime">0:00</span>
          </div>
        </div>

        <!-- 우측: 전체화면 -->
        <div class="controls-right">
          <button class="ctrl-btn" id="fullscreenBtn" title="전체화면 (f)">
            <svg id="fsEnterIcon" viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
            </svg>
            <svg id="fsExitIcon" viewBox="0 0 24 24" style="display:none;">
              <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
            </svg>
          </button>
        </div>

      </div>
    </div>

  </div>

  <script src="js/video-player.js?v=20261028_sound_fix"></script>
</body>

</html>
